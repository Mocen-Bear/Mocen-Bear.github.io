# Hexo 站点配置 —— Mocen_Bear 的博客
# 网站标题
title: Mocen_Bear
subtitle: 记录学习、折腾与生活
description: Mocen_Bear 的个人博客
author: Mocen_Bear
language: zh-CN
timezone: "Asia/Shanghai"

# 线上地址（部署到 GitHub Pages 用户站后无需修改）
url: https://mocen-bear.github.io/
permalink: posts/:title/

# 文章流放在 /blog/（首页 / 是引导门面页）
index_generator:
  path: blog
  per_page: 10
  order_by: -date

# 主题
theme: butterfly

server:
  port: 4000
  compress: true

marked:
  prependRoot: true
  postAsset: true