# Butterfly 主题配置（站点覆盖文件）—— Mocen_Bear 草莓熊主题
# 完整可选项见 themes/butterfly/_config.yml 和 https://butterfly.js.org/

menu:
  首页: / || fas fa-home
  关于我: /about/ || fas fa-user
  博客: /blog/ || fas fa-book-open
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags

# 头像（我的草莓熊）
avatar:
  img: /img/avatar.jpg
  effect: false

# Banner 大图
index_img: /img/banner.svg
default_top_img: /img/banner.svg
archive_img: /img/banner.svg

favicon: /img/favicon.jpg

# 首页 banner 高度（固定高比全屏构图更稳）
index_top_img_height: 400px

# 主题色：保持 Butterfly 默认（蓝）—— 与粉紫蓝渐变 Banner 最搭

# 本地搜索
search:
  use: local_search
  placeholder: 搜搜看…
  local_search:
    preload: false
    top_n_per_article: 2

# 暗色模式
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# 社交链接（GitHub 用户名定了以后填）
social:
  fab fa-github: https://github.com/ || Github || '#24292e'

# 代码块样式
code_blocks:
  theme: darker
  macStyle: true
  copy: true
  language: true

# 文章卡片封面（封面池：随机抽取，自带防重复逻辑）
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/cover-1.svg
    - /img/cover-2.svg
    - /img/cover-3.svg
    - /img/cover-4.svg
    - /img/cover-5.svg

# 侧栏
aside:
  card_author:
    button:
      enable: false
  card_announcement:
    enable: true
    content: 欢迎来到我的 blog

# 计数器：不蒜子官方接口已失效（script 能下、计数 API 超时）
# 改用 Vercount（兼容 busuanzi 网页标记的替代服务，国内可达）
CDN:
  option:
    busuanzi: https://cn.vercount.one/js

# 评论：Giscus（用 GitHub Discussions 当留言板，中文界面，读留言走 giscus 代理不经 GitHub 接口）
comments:
  use: Giscus
  text: true
  lazyload: false
giscus:
  repo: Mocen-Bear/Mocen-Bear.github.io
  repo_id: R_kgDOVbUUIQ
  category_id: DIC_kwDOVbUUIc4DJ5fW
  light_theme: light
  dark_theme: dark
  option:
    data-category: General
    data-lang: zh-CN

# 老评论系统（utterances）配置保留备查，已不启用
utterances:
  repo: Mocen-Bear/Mocen-Bear.github.io
  issue_term: pathname
  light_theme: github-light
  dark_theme: photon-dark

inject:
  head:
    - <link rel="stylesheet" href="/css/lotso.css">
  bottom:
    - <script defer src="/js/lotso_scroll.js"></script>
    - <script defer src="/js/lotso_cut.js"></script>